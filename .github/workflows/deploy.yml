name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # hosted-runner: this repository is public — GitHub-hosted minutes are free for
    # public repositories, and the org's ARC runner group does not admit them
    # (allows_public_repositories=false), so a self-hosted label queues forever.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Deploy via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/*"
          target: "/var/www/panbot-docs"
          strip_components: 1
