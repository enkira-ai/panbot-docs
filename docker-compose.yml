services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SITE_URL=https://docs.panbot.ai
      - BASE_PATH=/
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./astro.config.mjs:/app/astro.config.mjs
    expose:
      - "4321"
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    environment:
      - DOCS_PASSWORD=${DOCS_PASSWORD}
      - AUTH_PORT=4322
    expose:
      - "4322"
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    ports:
      - "80:80"
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - docs
      - auth
    restart: unless-stopped
