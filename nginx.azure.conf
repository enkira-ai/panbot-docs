server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Internal subrequest to validate session cookie
    location = /auth/validate {
        internal;
        proxy_pass http://127.0.0.1:4322/auth/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # Login page + POST handler (no auth required)
    location /auth/ {
        proxy_pass http://127.0.0.1:4322/auth/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # All other requests: validate cookie first, then serve static files
    location / {
        auth_request /auth/validate;
        error_page 401 = @login_redirect;

        try_files $uri $uri/ $uri.html /index.html;
    }

    location @login_redirect {
        return 302 /auth/login?next=$request_uri;
    }
}
